<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CONNECT 5 — Аномалия</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden;
    font-family:'Courier New',monospace; color:#c9c9c9; }
  canvas { display:block; }
  #ui { position:fixed; top:16px; left:50%; transform:translateX(-50%);
    font-size:14px; letter-spacing:2px; color:#9a9a9a; z-index:10; }
  #hud { position:fixed; left:16px; bottom:16px; font-size:14px;
    line-height:1.6; z-index:10; text-shadow:0 0 8px #000; }
  #subs { position:fixed; bottom:80px; left:0; right:0; text-align:center;
    font-size:17px; color:#e2e2e2; z-index:10; text-shadow:0 0 10px #000;
    padding:0 40px; }
  #title { position:fixed; inset:0; background:#000; z-index:20;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:30px; }
  #title h1 { font-size:52px; letter-spacing:14px; margin:0; }
  #title h2 { font-size:15px; letter-spacing:9px; color:#7d7d7d; margin:12px 0 0; }
  #title p { max-width:560px; margin-top:34px; font-size:14px;
    line-height:1.9; color:#8a8a8a; }
  #title button { margin-top:38px; background:none; border:1px solid #555;
    color:#cfcfcf; padding:14px 42px; font-size:16px; letter-spacing:4px;
    cursor:pointer; font-family:inherit; transition:.25s; }
  #title button:hover { background:#1a1a1a; border-color:#b03a3a; color:#fff; }
  #end { position:fixed; inset:0; background:#000; z-index:20; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; }
  #end h1 { letter-spacing:16px; font-size:40px; margin:0; }
  #end p { color:#7d7d7d; margin-top:20px; font-size:15px; letter-spacing:3px; }
  #end button { margin-top:36px; background:none; border:1px solid #444;
    color:#aaa; padding:12px 34px; font-family:inherit; font-size:14px;
    letter-spacing:3px; cursor:pointer; }
  #end button:hover { background:#151515; color:#fff; border-color:#b03a3a; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">НАЙДИ 5 АНОМАЛИЙ</div>
<div id="hud">
  РАССУДОК: <span id="sanity">100</span>%<br>
  АНОМАЛИИ: <span id="found">0</span> / 5
</div>
<div id="subs"></div>
<div id="title">
  <h1>CONNECT 5</h1>
  <h2>АНОМАЛИЯ</h2>
  <p>Найди 5 аномальных объектов. WASD — движение, SHIFT — бег, E — зафиксировать аномалию рядом.</p>
  <button id="startBtn">НАЧАТЬ</button>
</div>
<div id="end">
  <h1 id="endTitle">КОНЕЦ</h1>
  <p id="endText"></p>
  <button id="againBtn">СНАЧАЛА</button>
</div>

<script>
'use strict';
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var elSanity = document.getElementById('sanity');
  var elFound = document.getElementById('found');
  var elSubs = document.getElementById('subs');
  var elTitle = document.getElementById('title');
  var elEnd = document.getElementById('end');
  var elEndTitle = document.getElementById('endTitle');
  var elEndText = document.getElementById('endText');

  var W = 1600, H = 1200;
  var state = {
    running: false,
    sanity: 100,
    found: 0,
    time: 0,
    player: { x: W/2, y: H/2, r: 14, speed: 3 },
    keys: {},
    walls: [],
    anomalies: [],
    msgT: 0
  };

  function resize() {
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function buildWorld() {
    state.walls = [
      {x:0,y:0,w:W,h:20}, {x:0,y:H-20,w:W,h:20},
      {x:0,y:0,w:20,h:H}, {x:W-20,y:0,w:20,h:H},
      {x:400,y:400,w:400,h:20},
      {x:400,y:400,w:20,h:400},
      {x:900,y:200,w:20,h:500},
      {x:900,y:200,w:400,h:20}
    ];
    var spots = [
      {x:120,y:120,name:'Лампа без источника'},
      {x:W-140,y:120,name:'Отражение без тела'},
      {x:120,y:H-140,name:'Часы идущие назад'},
      {x:W-140,y:H-140,name:'Тень под потолком'},
      {x:W/2,y:100,name:'Дверь в никуда'}
    ];
    state.anomalies = [];
    for (var i=0;i<spots.length;i++) {
      state.anomalies.push({
        x: spots[i].x, y: spots[i].y, name: spots[i].name,
        found: false, pulse: Math.random()*6.28
      });
    }
  }

  function collide(nx, ny) {
    var r = state.player.r;
    for (var i=0;i<state.walls.length;i++) {
      var w = state.walls[i];
      if (nx+r > w.x && nx-r < w.x+w.w &&
          ny+r > w.y && ny-r < w.y+w.h) return true;
    }
    return false;
  }

  function say(text, dur) {
    elSubs.textContent = text;
    state.msgT = dur || 3;
  }

  function update(dt) {
    if (!state.running) return;
    state.time += dt;

    var p = state.player, k = state.keys;
    var dx=0, dy=0;
    if (k.w || k.arrowup) dy -= 1;
    if (k.s || k.arrowdown) dy += 1;
    if (k.a || k.arrowleft) dx -= 1;
    if (k.d || k.arrowright) dx += 1;

    var sprint = k.shift && (dx||dy) && state.sanity > 5;
    var sp = sprint ? 5 : 3;
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }

    var nx = p.x + dx*sp*dt*60;
    var ny = p.y + dy*sp*dt*60;
    if (!collide(nx, p.y)) p.x = nx;
    if (!collide(p.x, ny)) p.y = ny;

    var decay = 0.6;
    if (sprint) decay += 1.8;
    for (var i=0;i<state.anomalies.length;i++) {
      var a = state.anomalies[i];
      if (a.found) continue;
      var d = Math.hypot(a.x-p.x, a.y-p.y);
      if (d < 180) decay += (1-d/180)*2.2;
      if (d < 60 && k.e) {
        a.found = true;
        state.found++;
        elFound.textContent = state.found;
        say('Зафиксировано: ' + a.name, 3);
        state.sanity = Math.min(100, state.sanity+6);
        k.e = false;
      }
    }
    state.sanity = Math.max(0, state.sanity - decay*dt);

    if (state.found >= 5) return finish(true);
    if (state.sanity <= 0) return finish(false);

    if (state.msgT > 0) {
      state.msgT -= dt;
      if (state.msgT <= 0) elSubs.textContent = '';
    }

    elSanity.textContent = Math.floor(state.sanity);
  }

  function render() {
    var vw = cv.width, vh = cv.height;
    var p = state.player;
    var camX = p.x - vw/2;
    var camY = p.y - vh/2;

    ctx.fillStyle = '#0a0a0c';
    ctx.fillRect(0,0,vw,vh);

    ctx.strokeStyle = 'rgba(60,60,70,0.15)';
    ctx.beginPath();
    var grid = 80;
    for (var x = Math.floor(camX/grid)*grid; x < camX+vw+grid; x += grid) {
      ctx.moveTo(x-camX, 0); ctx.lineTo(x-camX, vh);
    }
    for (var y = Math.floor(camY/grid)*grid; y < camY+vh+grid; y += grid) {
      ctx.moveTo(0, y-camY); ctx.lineTo(vw, y-camY);
    }
    ctx.stroke();

    for (var i=0;i<state.walls.length;i++) {
      var w = state.walls[i];
      var x = w.x-camX, y = w.y-camY;
      if (x+w.w < 0 || y+w.h < 0 || x > vw || y > vh) continue;
      ctx.fillStyle = '#1a1a1e';
      ctx.fillRect(x, y, w.w, w.h);
      ctx.strokeStyle = '#2a2a30';
      ctx.strokeRect(x+0.5, y+0.5, w.w-1, w.h-1);
    }

    for (var j=0;j<state.anomalies.length;j++) {
      var a = state.anomalies[j];
      var ax = a.x-camX, ay = a.y-camY;
      if (ax<-100 || ay<-100 || ax>vw+100 || ay>vh+100) continue;
      var t = state.time*2 + a.pulse;
      var flick = a.found ? 0.15 : 0.5 + Math.sin(t*3)*0.25;
      var g = ctx.createRadialGradient(ax, ay, 0, ax, ay, 70);
      g.addColorStop(0, 'rgba(180,58,58,'+flick+')');
      g.addColorStop(1, 'rgba(180,58,58,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ax, ay, 70, 0, 6.283); ctx.fill();
      ctx.fillStyle = a.found ? '#555' : '#b03a3a';
      ctx.beginPath(); ctx.arc(ax, ay, 7, 0, 6.283); ctx.fill();
    }

    var px = p.x-camX, py = p.y-camY;
    ctx.fillStyle = '#dcdcdc';
    ctx.beginPath(); ctx.arc(px, py, p.r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(220,220,220,0.35)';
    ctx.beginPath(); ctx.arc(px, py, p.r+5, 0, 6.283); ctx.stroke();

    var s = state.sanity/100;
    if (s < 0.6) {
      var v = (0.6-s)/0.6;
      var vg = ctx.createRadialGradient(vw/2, vh/2, Math.min(vw,vh)*0.25,
                                        vw/2, vh/2, Math.max(vw,vh)*0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(60,0,0,'+(v*0.85)+')');
      ctx.fillStyle = vg;
      ctx.fillRect(0,0,vw,vh);
    }
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now-last)/1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.addEventListener('keydown', function(e) {
    var k = e.key.toLowerCase();
    state.keys[k] = true;
  });
  window.addEventListener('keyup', function(e) {
    state.keys[e.key.toLowerCase()] = false;
  });

  function startGame() {
    buildWorld();
    state.sanity = 100;
    state.found = 0;
    state.time = 0;
    state.player.x = W/2;
    state.player.y = H/2;
    elSanity.textContent = '100';
    elFound.textContent = '0';
    elSubs.textContent = 'Найди 5 аномалий. WASD — движение, E — зафиксировать.';
    state.msgT = 5;
    elTitle.style.display = 'none';
    elEnd.style.display = 'none';
    state.running = true;
  }

  function finish(win) {
    state.running = false;
    elEnd.style.display = 'flex';
    elEndTitle.textContent = win ? 'ЗАФИКСИРОВАНО' : 'ПОТЕРЯ РАССУДКА';
    elEndText.textContent = win
      ? 'Все аномалии отмечены. Рассудок: ' + Math.floor(state.sanity) + '%'
      : 'Ты не успел. Реальность растворилась.';
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', function() {
    elEnd.style.display = 'none';
    elTitle.style.display = 'flex';
  });
})();
</script>
</body>
</html>
